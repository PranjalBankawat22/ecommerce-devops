apiVersion: v1
kind: ConfigMap

metadata:
  name: cart-service-config
  labels:
    app: cart-service

data:
  PORT: "4002"
  REDIS_URL: "redis://redis:6379"
  PRODUCT_SERVICE_URL: "http://product-service:4001"
  CORS_ORIGIN: "http://localhost:3000"
---
# Source: ecommerce/templates/product-configmap.yaml
apiVersion: v1
kind: ConfigMap

metadata:
  name: product-service-config
  labels:
    app: product-service

data:
  PORT: "4001"
  CORS_ORIGIN: "http://localhost:3000"
---
