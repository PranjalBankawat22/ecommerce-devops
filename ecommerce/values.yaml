# Default values for ecommerce.

frontend:
  replicaCount: 1

  image:
    repository: ecommerce-frontend
    tag: "2.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  env:
    productServiceUrl: "http://product-service:4001"

  probes:
    readiness:
      path: /api/health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    liveness:
      path: /api/health
      initialDelaySeconds: 20
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3


productService:
  replicaCount: 1

  image:
    repository: ecommerce-product-service
    tag: "1.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 4001
    targetPort: 4001

  config:
    port: "4001"
    corsOrigin: "http://localhost:3000"

  secret:
    name: product-service-secret


cartService:
  replicaCount: 1

  image:
    repository: ecommerce-cart-service
    tag: "1.0"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 4002
    targetPort: 4002

  config:
    port: "4002"
    redisUrl: "redis://redis:6379"
    productServiceUrl: "http://product-service:4001"
    corsOrigin: "http://localhost:3000"

  probes:
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    liveness:
      path: /health
      initialDelaySeconds: 20
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3


redis:
  replicaCount: 1

  image:
    repository: redis
    tag: "8-alpine"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379


ingress:
  enabled: true

  className: traefik

  paths:
    - path: /
      pathType: Prefix
      service:
        name: frontend
        port: 3000

    - path: /api/products
      pathType: Prefix
      service:
        name: product-service
        port: 4001

    - path: /api/cart
      pathType: Prefix
      service:
        name: cart-service
        port: 4002