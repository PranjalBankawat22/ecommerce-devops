apiVersion: v1
kind: Service

metadata:
  name: cart-service
  labels:
    app: cart-service

spec:
  type: {{ .Values.cartService.service.type }}

  selector:
    app: cart-service

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.cartService.service.port }}
      targetPort: {{ .Values.cartService.service.targetPort }}