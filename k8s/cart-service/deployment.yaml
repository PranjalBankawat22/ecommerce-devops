apiVersion: apps/v1
kind: Deployment

metadata:
  name: cart-service
  namespace: ecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: cart-service

  template:
    metadata:
      labels:
        app: cart-service

    spec:
      containers:
        - name: cart-service
          image: ecommerce-cart-service:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4002

          envFrom:
            - configMapRef:
                name: cart-service-config

          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3