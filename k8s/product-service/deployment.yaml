apiVersion: apps/v1
kind: Deployment

metadata:
  name: product-service
  namespace: ecommerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app: product-service

  template:
    metadata:
      labels:
        app: product-service

    spec:
      containers:
        - name: product-service
          image: ecommerce-product-service:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 4001

          envFrom:
            - configMapRef:
                name: product-service-config

            - secretRef:
                name: product-service-secret